spring.application.name=Taskflow API

# Database Configuration
# Use environment variables in production, defaults for local development
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/taskflow}
spring.datasource.username=${DB_USERNAME:taskflow_user}
spring.datasource.password=${DB_PASSWORD:taskflow_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.taskflow.messaging.TaskEvent
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.group-id=taskflow-event-processor
spring.kafka.consumer.properties.spring.json.trusted.packages=com.taskflow.messaging

#Metrics Configuration
management.endpoints.web.exposure.include=health,prometheus