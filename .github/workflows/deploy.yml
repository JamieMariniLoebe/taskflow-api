name: Deploy TaskFlowAPI

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Maven tests
        run: mvn test -B

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/taskflow-api:$IMAGE_TAG -t $ECR_REGISTRY/taskflow-api:latest .
          docker push $ECR_REGISTRY/taskflow-api:$IMAGE_TAG
          docker push $ECR_REGISTRY/taskflow-api:latest

      - name: Force new ECS deployment
        run: |
          aws ecs update-service \
            --cluster taskflow_cluster \
            --service taskflow-api \
            --task-definition taskflow-api \
            --force-new-deployment \